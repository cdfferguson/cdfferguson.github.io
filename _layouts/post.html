---
layout: default
---
<article class="prose" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="post-header">
    <time class="post-list__date" datetime="{{ page.date | date_to_xmlschema }}"
          itemprop="datePublished">
      {{ page.date | date: "%-d %B %Y" }}
    </time>
    <h1 itemprop="headline">{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="intro__lede">{{ page.subtitle }}</p>
    {%- endif %}
  </header>

  <div itemprop="articleBody">
    {{ content }}
  </div>

  <footer class="post-footer">
    {%- if page.tags and page.tags.size > 0 %}
    <span class="tag-list">
      {%- for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor -%}
    </span>
    {%- else %}<span></span>{% endif %}

    <a href="{{ '/blog/' | relative_url }}">← All posts</a>
  </footer>
</article>
