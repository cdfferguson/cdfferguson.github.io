# ---------------------------------------------------------------------------
# Site identity  —  edit these first
# ---------------------------------------------------------------------------
title: Christopher Ferguson
# TODO: the tagline appears beside your name in the homepage title and in
# search results. Make it sound like you.
tagline: Lawyer in Toronto
description: >-
  Personal site of Christopher Ferguson, a lawyer in Toronto — writing, a CV,
  and a short introduction.
author: Christopher Ferguson

# Shown in small type at the foot of every page. Set to "" to remove it.
disclaimer: >-
  Views expressed here are my own and not those of my firm or its clients.
  Nothing on this site is legal advice.

# The canonical address of the site. For a GitHub user site this is
# https://<username>.github.io with an empty baseurl.
url: https://cdfferguson.github.io
baseurl: ""

# ---------------------------------------------------------------------------
# Contact / social  —  leave a value blank to hide that link
# ---------------------------------------------------------------------------
email: chris@cferguson.org
github: cdfferguson
# TODO: your LinkedIn vanity slug, e.g. "christopher-ferguson-1a2b3c"
linkedin: ""
bluesky: ""
mastodon: ""

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
theme_color: "#8a4b2a"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
