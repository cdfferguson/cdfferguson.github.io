# ---------------------------------------------------------------------------
# Site identity  —  edit these first
# ---------------------------------------------------------------------------
title: Chris Ferguson
tagline: Writing, work, and things I'm figuring out
description: >-
  Personal site of Chris Ferguson — a blog, a CV, and a short introduction.
author: Chris Ferguson

# The canonical address of the site. For a GitHub user site this is
# https://<username>.github.io with an empty baseurl.
url: https://cdfferguson.github.io
baseurl: ""

# ---------------------------------------------------------------------------
# Contact / social  —  leave a value blank to hide that link
# ---------------------------------------------------------------------------
email: chris@cferguson.org
github: cdfferguson
linkedin: ""
bluesky: ""
mastodon: ""

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
theme_color: "#8a4b2a"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
